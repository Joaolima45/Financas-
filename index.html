<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Finanças</title>
<style>
:root{
  --bg:#0b1020;--stroke:rgba(255,255,255,.22);--text:#f5f7ff;--muted:rgba(235,240,255,.62);
  --green:#3ee08f;--red:#ff6b7a;--yellow:#feca57;--blue:#5aa8ff;--violet:#6a5cff;--r:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#1a2350 0%,#0b1020 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7;animation:float 20s ease-in-out infinite}
.b1{width:340px;height:340px;background:#6a5cff;top:-80px;left:-90px}
.b2{width:300px;height:300px;background:#ff5fa2;top:260px;right:-130px;animation-delay:-7s}
.b3{width:320px;height:320px;background:#20c9b0;bottom:-80px;left:-50px;animation-delay:-13s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,40px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

.app{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 120px)}

.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.30)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,0) 38%)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.hello{min-width:0}
.hello small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello b{font-size:24px;letter-spacing:-.4px}
.hright{display:flex;gap:8px;align-items:center}
.month{display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px}
.month button,.iconbtn{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.month button:active,.iconbtn:active{background:rgba(255,255,255,.15)}
.month span{font-weight:600;font-size:14px;min-width:70px;text-align:center}
.iconbtn{width:44px;height:44px}
.iconbtn svg{width:21px;height:21px}

.card{padding:20px;margin-bottom:14px}
.label{color:var(--muted);font-size:13px;font-weight:500}
.big{font-size:36px;font-weight:800;letter-spacing:-1px;margin:4px 0 14px}
.row{display:flex;gap:10px}
.pill{flex:1;min-width:0;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.pill .v{font-weight:700;font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.in{color:var(--green)}.out{color:var(--red)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.sec-title h3{margin:0;font-size:18px;letter-spacing:-.3px}
.link{all:unset;color:var(--blue);font-size:14px;cursor:pointer;font-weight:500}

.donut-wrap{display:flex;align-items:center;gap:16px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:4px;flex:none}
.legend span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend span:last-child{margin-left:auto;color:var(--muted)}

.list{padding:4px 0;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.item:active{background:rgba(255,255,255,.05)}
.item+.item{border-top:1px solid rgba(255,255,255,.08)}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.14);color:var(--text)}
.item .amt{font-weight:700;font-size:15px;white-space:nowrap}
.day{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:12px 18px 2px}
.empty{padding:26px 20px;text-align:center;color:var(--muted);font-size:14px}

.budget{padding:15px 18px}
.budget+.budget{border-top:1px solid rgba(255,255,255,.08)}
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px;gap:8px}
.bhead b{font-weight:600}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.bfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}

.seg{display:flex;padding:4px;border-radius:999px;margin-bottom:14px}
.seg button{all:unset;flex:1;text-align:center;padding:9px 0;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.25s}
.seg button.on{background:rgba(255,255,255,.22);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

.btn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;padding:15px;border-radius:22px;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10)}
.btn.primary{background:linear-gradient(135deg,rgba(90,168,255,.85),rgba(106,92,255,.85));border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px rgba(90,120,255,.35)}
.btn.green{background:linear-gradient(135deg,rgba(62,224,143,.85),rgba(32,201,176,.85));border-color:rgba(255,255,255,.35);color:#062018}
.btn.danger{background:rgba(255,107,122,.18);border-color:rgba(255,107,122,.5);color:#ffb3bb}
.btn.small{padding:11px;font-size:14px;border-radius:16px;margin-top:8px}
.btn:active{transform:scale(.98)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}

/* recomendações */
.rec{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.rec+.rec{border-top:1px solid rgba(255,255,255,.08)}
.rec .ri{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:17px}
.rec b{display:block;font-size:14.5px;margin-bottom:2px}
.rec p{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
.lv-bad .ri{background:rgba(255,107,122,.22)}.lv-warn .ri{background:rgba(254,202,87,.22)}
.lv-good .ri{background:rgba(62,224,143,.22)}.lv-tip .ri{background:rgba(90,168,255,.22)}

/* banners */
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-bottom:14px;border-radius:22px}
.banner .t{flex:1;font-size:13.5px;line-height:1.35}
.banner .t b{display:block;font-size:14.5px}
.banner .go{all:unset;cursor:pointer;font-weight:700;font-size:13px;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.2);white-space:nowrap}
.banner .x{all:unset;cursor:pointer;color:var(--muted);font-size:18px;padding:0 4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:999px;margin-top:12px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

/* cartões */
.ccard{position:relative;border-radius:26px;padding:18px 20px;margin-bottom:12px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 30px rgba(0,0,0,.35)}
.ccard::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 40%,rgba(0,0,0,.18) 100%);pointer-events:none}
.ccard .n{font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.ccard .chipst{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.25)}
.ccard .val{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:14px 0 2px}
.ccard .sub{font-size:13px;opacity:.85}
.ccard .bar{background:rgba(0,0,0,.25);height:7px;margin-top:14px}
.ccard .bar i{background:rgba(255,255,255,.9)}
.cdetail{padding:6px 0 10px;margin:-4px 0 14px}
.cdetail .inner{padding:0 16px}
.mini{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.mini div{flex:none;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:12px;text-align:center;min-width:76px}
.mini div b{display:block;font-size:13px;margin-top:2px}

/* tab bar */
nav.tabs{position:fixed;z-index:20;bottom:calc(env(safe-area-inset-bottom) + 14px);left:16px;right:88px;max-width:420px;
  display:flex;padding:6px;border-radius:999px}
@media (min-width:560px){nav.tabs{left:calc(50% - 244px);right:auto;width:420px}}
nav.tabs button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:999px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;transition:.25s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--text);background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.fab{all:unset;position:fixed;z-index:21;bottom:calc(env(safe-area-inset-bottom) + 14px);right:16px;
  width:62px;height:62px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:32px;font-weight:300;color:#062018;
  background:linear-gradient(135deg,rgba(62,224,143,.92),rgba(32,201,176,.92));border:1px solid rgba(255,255,255,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 26px rgba(32,201,176,.45)}
@media (min-width:560px){.fab{right:calc(50% - 244px)}}
.fab:active{transform:scale(.94)}

/* sheet + modal */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(5,8,20,.5);opacity:0;pointer-events:none;transition:.3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;border-radius:32px 32px 0 0;max-height:92vh;overflow-y:auto;
  padding:12px 18px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(180deg,rgba(40,48,90,.82),rgba(20,24,48,.92));border-bottom:none}
.sheet:not(.on){visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.3,1),visibility 0s .4s}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.35);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.amount-in{width:100%;background:none;border:none;color:var(--text);font:800 40px var(--font);letter-spacing:-1px;outline:none;margin-bottom:8px}
.field{width:100%;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--text);font:500 16px var(--font);outline:none;margin-bottom:10px;-webkit-appearance:none;appearance:none}
.field:focus{border-color:rgba(255,255,255,.4)}
input[type=date].field{min-height:50px}
.flabel{font-size:12px;color:var(--muted);font-weight:600;margin:6px 4px 6px;text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips button{all:unset;flex:none;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.chips button.on{background:linear-gradient(135deg,rgba(90,168,255,.75),rgba(106,92,255,.75));border-color:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.chips .dot{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid transparent}
.chips .dot.on{border-color:#fff}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.optrow .t{font-size:15px;font-weight:600}.optrow small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.18);transition:.25s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{all:unset;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);cursor:pointer;font-size:18px;font-weight:700}
.stepper b{min-width:34px;text-align:center;font-size:16px}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}

.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(5,8,20,.55);opacity:0;pointer-events:none;transition:.25s}
.modal-wrap.on{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:380px;padding:22px;background:linear-gradient(180deg,rgba(44,52,96,.9),rgba(22,26,52,.95));transform:scale(.94);transition:.25s}
.modal-wrap.on .modal{transform:none}
.modal h4{margin:0 0 6px;font-size:19px}
.modal p{margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.45}

.toast{position:fixed;z-index:60;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-160%);
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:.4s cubic-bezier(.2,.9,.3,1);white-space:nowrap;
  background:linear-gradient(135deg,rgba(60,70,120,.85),rgba(30,36,70,.9))}
.toast.on{transform:translate(-50%,0)}

.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.srow{display:flex;align-items:center;gap:12px;padding:13px 16px}
.srow+.srow{border-top:1px solid rgba(255,255,255,.08)}
.srow .t{flex:1;min-width:0;font-size:15px}
.srow .t small{display:block;color:var(--muted);font-size:12px}
.srow input.lim{width:110px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--text);font:600 15px var(--font);text-align:right;outline:none}
.del{all:unset;cursor:pointer;color:var(--muted);font-size:18px;padding:4px}
.help{font-size:13.5px;color:var(--muted);line-height:1.5}
.help b{color:var(--text)}
.help ol{padding-left:20px;margin:8px 0}
.kpi3{display:flex;gap:8px;margin-top:6px}
.kpi3>div{flex:1;padding:12px 10px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);text-align:center}
.kpi3 b{display:block;font-size:20px;margin-top:2px}
.kpi3 small{color:var(--muted);font-size:11px}
.search{margin-bottom:12px}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="app">
  <header class="top">
    <div class="hello"><small id="hello">Olá 👋</small><b id="viewTitle">Visão geral</b></div>
    <div class="hright">
      <div class="month glass" id="monthBox"><button data-act="prev" aria-label="Mês anterior">‹</button><span id="monthLabel"></span><button data-act="next" aria-label="Próximo mês">›</button></div>
      <button class="iconbtn glass" data-act="go" data-v="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs glass" id="tabs">
  <button data-act="go" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-act="go" data-v="lanc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lançamentos</button>
  <button data-act="go" data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>Cartões</button>
  <button data-act="go" data-v="anal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Análise</button>
</nav>
<button class="fab" data-act="add" aria-label="Novo lançamento">+</button>

<div class="scrim" id="scrim" data-act="close-sheet"></div>
<div class="sheet glass" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="modal-wrap" id="modalWrap"><div class="modal glass" id="modal"></div></div>
<div class="toast glass" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
'use strict';
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=v=>Math.round(v*100)/100;
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ymOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
function ymAdd(s,k){let[y,m]=s.split('-').map(Number);m=m-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;return `${y}-${pad(m+1)}`}
function ymDiff(a,b){const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return(ay-by)*12+(am-bm)}
function daysIn(s){const[y,m]=s.split('-').map(Number);return new Date(y,m,0).getDate()}
const dateIn=(s,day)=>`${s}-${pad(Math.min(day,daysIn(s)))}`;
const ymLabel=s=>{const[y,m]=s.split('-').map(Number);return `${MES3[m-1]}/${String(y).slice(2)}`};
const ymLong=s=>{const[y,m]=s.split('-').map(Number);return `${MESES[m-1]} de ${y}`};

const fmtDay=d=>new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short'});

const DB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('financas-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
   r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
 get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 set(k,v){return new Promise(res=>{if(!this.db)return res(false);try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
};

/* ================= motor: lançamentos do mês ================= */
// fatura (mês de vencimento) em que cai uma compra feita na data d
function faturaOf(card,d){const m=d.slice(0,7),day=+d.slice(8);const close=day>=card.fech?ymAdd(m,1):m;return card.venc>card.fech?close:ymAdd(close,1)}
function closeDate(card,F){return dateIn(card.venc>card.fech?F:ymAdd(F,-1),card.fech)}
function entriesFor(M){
  const out=[];
  for(const t of S.tx){
    const card=t.pay&&t.pay!=='conta'?cardById(t.pay):null;
    const start=t.date.slice(0,7),day=+t.date.slice(8),sign=t.type==='in'?1:-1;
    const skipped=O=>O<start||(t.end&&O>t.end)||(t.skip||[]).includes(O);
    if(t.rec){
      if(!card){ if(skipped(M))continue;
        out.push({t,key:t.id+'@'+M,occ:M,desc:t.desc,cat:t.cat,v:sign*t.amount,date:dateIn(M,day),tag:'Todo mês'});
      } else for(let k=0;k<=2;k++){const O=ymAdd(M,-k);if(skipped(O))continue;const d=dateIn(O,day);
        if(faturaOf(card,d)===M)out.push({t,key:t.id+'@'+O,occ:O,desc:t.desc,cat:t.cat,v:-t.amount,date:d,card:card.id,tag:'Todo mês'});}
    } else if(card){
      const n=Math.max(1,t.parc||1),F0=faturaOf(card,t.date),k=ymDiff(M,F0);
      if(k<0||k>=n)continue;
      const base=Math.floor(t.amount/n*100)/100,v=k===n-1?r2(t.amount-base*(n-1)):base;
      out.push({t,key:t.id+'#'+k,occ:M,desc:t.desc,cat:t.cat,v:-v,date:t.date,card:card.id,tag:n>1?`${k+1}/${n}`:null});
    } else if(start===M) out.push({t,key:t.id,occ:M,desc:t.desc,cat:t.cat,v:sign*t.amount,date:t.date});
  }
  return out.sort((a,b)=>b.date.localeCompare(a.date)||a.desc.localeCompare(b.desc));
}
function summary(M){
  const E=entriesFor(M);let rec=0,desp=0,cardT=0;const by={};
  for(const e of E){if(e.v>0)rec+=e.v;else{desp-=e.v;by[e.cat]=(by[e.cat]||0)-e.v;if(e.card)cardT-=e.v}}
  return{E,rec:r2(rec),desp:r2(desp),saldo:r2(rec-desp),by,cardT:r2(cardT)};
}
function cardFatura(card,F){const E=entriesFor(F).filter(e=>e.card===card.id);return{E,total:r2(-E.reduce((s,e)=>s+e.v,0))}}
function cardStatus(card,F){
  if((card.paid||{})[F])return{t:'Paga',c:'#3ee08f'};
  const today=todayStr(),cl=closeDate(card,F),due=dateIn(F,card.venc);
  if(today<cl)return{t:'Aberta',c:'#5aa8ff'};
  if(today>due)return{t:'Vencida',c:'#ff6b7a'};
  return{t:'Fechada',c:'#feca57'};
}
function cardUsed(card){
  const cur=faturaOf(card,todayStr());let used=0;
  for(let k=-1;k<=48;k++){const F=ymAdd(cur,k);if((card.paid||{})[F])continue;
    for(const e of entriesFor(F))if(e.card===card.id&&(!e.t.rec||k<=0))used-=e.v;}
  return r2(used);
}

/* ================= recomendações ================= */
function recommendations(M){
  const R=[],s=summary(M),{rec,desp,by}=s;
  const prev=[1,2,3].map(k=>summary(ymAdd(M,-k))).filter(x=>x.E.length);
  const avg=id=>prev.length?prev.reduce((a,x)=>a+(x.by[id]||0),0)/prev.length:0;
  const outCats=S.cats.filter(c=>c.type==='out');
  const isCur=M===ymOf(new Date());
  if(!s.E.length){R.push({l:'tip',i:'👋',t:'Comece pelos fixos',p:'Cadastre seu salário e aluguel marcando “Repetir todo mês”. Eles aparecerão automaticamente nos próximos meses.'});return R}
  if(rec===0)R.push({l:'warn',i:'💼',t:'Nenhuma receita neste mês',p:'Lance seu salário (de preferência como recorrente) para que o app calcule quanto sobra e quanto você pode guardar.'});
  if(rec>0){const tx=(rec-desp)/rec;
    if(tx<0)R.push({l:'bad',i:'🚨',t:`Gastos acima da renda em ${brl(desp-rec)}`,p:'Este mês você gastou mais do que ganhou. Revise as categorias de desejos (lazer, delivery, compras) e evite novos parcelamentos até equilibrar.'});
    else if(tx<.1)R.push({l:'warn',i:'⚠️',t:`Você está guardando só ${Math.round(tx*100)}% da renda`,p:`A meta recomendada é 20% (${brl(rec*.2)}). Faltam ${brl(rec*.2-(rec-desp))} para chegar lá.`});
    else if(tx>=.2)R.push({l:'good',i:'🎉',t:`Ótimo! Sobrou ${Math.round(tx*100)}% da renda`,p:`Separe ${brl(rec-desp)} assim que o salário cair: primeiro para a reserva de emergência, depois para investimentos.`});
    else R.push({l:'tip',i:'💡',t:`Sobra de ${Math.round(tx*100)}% — dá pra chegar a 20%`,p:`Cortando ${brl(rec*.2-(rec-desp))} nos gastos variáveis você atinge a meta de poupar 20%.`});
    const moradia=by.moradia||0;
    if(moradia/rec>.3)R.push({l:'warn',i:'🏠',t:`Moradia consome ${Math.round(moradia/rec*100)}% da renda`,p:'O ideal é ficar abaixo de 30%. Vale renegociar o aluguel no reajuste ou dividir custos fixos da casa.'});
    const want=outCats.filter(c=>c.kind==='want').reduce((a,c)=>a+(by[c.id]||0),0);
    if(want/rec>.3){const top=outCats.filter(c=>c.kind==='want').sort((a,b)=>(by[b.id]||0)-(by[a.id]||0))[0];
      R.push({l:'warn',i:'🎯',t:`Desejos em ${Math.round(want/rec*100)}% da renda`,p:`Pela regra 50/30/20, o teto é 30% (${brl(rec*.3)}). O maior peso é ${top.n} (${brl(by[top.id]||0)}).`});}
  }
  for(const c of outCats){const g=by[c.id]||0;
    if(c.lim>0&&g>c.lim)R.push({l:'bad',i:c.e,t:`${c.n} estourou o limite`,p:`Você gastou ${brl(g)}, ${brl(g-c.lim)} acima do limite de ${brl(c.lim)}.`});
    else if(c.lim>0&&g>=c.lim*.8&&isCur)R.push({l:'warn',i:c.e,t:`${c.n} perto do limite`,p:`Já foram ${brl(g)} de ${brl(c.lim)} (${Math.round(g/c.lim*100)}%). Restam ${brl(c.lim-g)} até o fim do mês.`});
    const a=avg(c.id);if(a>0&&g>a*1.25&&g-a>50)R.push({l:'warn',i:'📈',t:`${c.n} subiu ${Math.round((g/a-1)*100)}%`,p:`Média dos últimos meses: ${brl(a)}. Este mês: ${brl(g)} (+${brl(g-a)}).`});
  }
  const dl=by.delivery||0;
  if(dl>0&&dl>=(by.mercado||0)*.5&&dl>150)R.push({l:'tip',i:'🍳',t:`Delivery e restaurantes: ${brl(dl)}`,p:`Reduzir pela metade economizaria cerca de ${brl(dl/2*12)} por ano. Planejar as refeições da semana ajuda muito.`});
  const subs=S.tx.filter(t=>t.rec&&t.cat==='assinaturas'&&t.type==='out'&&!(t.end&&t.end<M));
  if(subs.length>=2){const tot=subs.reduce((a,t)=>a+t.amount,0);R.push({l:'tip',i:'📺',t:`${subs.length} assinaturas somam ${brl(tot)}/mês`,p:`Isso dá ${brl(tot*12)} por ano. Cancele as que usou pouco nos últimos 30 dias ou alterne entre serviços.`});}
  for(const card of S.cards){
    const f=cardFatura(card,M).total;
    if(rec>0&&f/rec>.4)R.push({l:'warn',i:'💳',t:`Fatura do ${card.n} = ${Math.round(f/rec*100)}% da renda`,p:'Faturas acima de 30–40% da renda costumam apertar o mês seguinte. Prefira pagar à vista o que for possível.'});
    const st=cardStatus(card,M),due=dateIn(M,card.venc),dleft=Math.round((new Date(due+'T12:00')-new Date(todayStr()+'T12:00'))/864e5);
    if(f>0&&!(card.paid||{})[M]&&dleft>=0&&dleft<=5&&isCur)R.push({l:'bad',i:'⏰',t:`Fatura do ${card.n} vence ${dleft===0?'hoje':'em '+dleft+' dia'+(dleft>1?'s':'')}`,p:`Valor de ${brl(f)}. Pagar em dia evita juros do rotativo, que estão entre os mais altos do mercado.`});
    if(st.t==='Vencida'&&f>0)R.push({l:'bad',i:'⏰',t:`Fatura do ${card.n} está vencida`,p:'Se já pagou, toque no cartão e marque como paga. Se não, pague o quanto antes para evitar juros.'});
  }
  let fut=0;for(const card of S.cards)for(let k=1;k<=12;k++)fut+=cardFatura(card,ymAdd(M,k)).E.filter(e=>!e.t.rec).reduce((a,e)=>a-e.v,0);
  if(rec>0&&fut>rec*.5)R.push({l:'warn',i:'🧾',t:`${brl(fut)} já comprometidos em parcelas futuras`,p:'Muitas parcelas reduzem sua margem nos próximos meses. Evite novos parcelamentos até essa conta diminuir.'});
  if(prev.length&&rec>desp){const avgD=(prev.reduce((a,x)=>a+x.desp,0)+desp)/(prev.length+1);
    R.push({l:'tip',i:'🛟',t:`Reserva de emergência ideal: ${brl(avgD*6)}`,p:`São 6 meses do seu gasto médio (${brl(avgD)}). Guarde em algo com liquidez diária, como Tesouro Selic ou CDB com liquidez.`});}
  if(!outCats.some(c=>c.lim>0))R.push({l:'tip',i:'🎚️',t:'Defina limites por categoria',p:'Em Ajustes › Categorias você pode criar limites (ou sugerir automaticamente) e o app avisa quando estiver perto de estourar.'});
  const order={bad:0,warn:1,good:2,tip:3};return R.sort((a,b)=>order[a.l]-order[b.l]);
}

function donut(by,total,center){
  const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);let off=25,svg='<circle cx="21" cy="21" r="15.9" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/>';
  if(total>0)ents.forEach(([k,v])=>{const p=v/total*100;svg+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${catById(k).c}" stroke-width="5" stroke-dasharray="${Math.max(p-1,0.01)} ${100-Math.max(p-1,0.01)}" stroke-dashoffset="${off}"/>`;off-=p});
  svg+=`<text x="21" y="20" text-anchor="middle" fill="rgba(235,240,255,.62)" font-size="3.2">${center[0]}</text><text x="21" y="25.2" text-anchor="middle" fill="#fff" font-size="4.6" font-weight="800">${center[1]}</text>`;
  const leg=ents.slice(0,6).map(([k,v])=>`<div><i style="background:${catById(k).c}"></i><span>${esc(catById(k).n)}</span><span>${Math.round(v/total*100)}%</span></div>`).join('');
  return `<div class="card glass donut-wrap"><svg width="128" height="128" viewBox="0 0 42 42" style="flex:none">${svg}</svg><div class="legend">${leg||'<div class="label">Sem despesas neste mês</div>'}</div></div>`;
}

/* ---- Análise ---- */
function vAnal(){
  const s=summary(M),R=recommendations(M),outCats=S.cats.filter(c=>c.type==='out');
  const need=outCats.filter(c=>c.kind==='need').reduce((a,c)=>a+(s.by[c.id]||0),0),want=s.desp-need,sav=s.rec-s.desp;
  const P=v=>s.rec?Math.round(v/s.rec*100)+'%':'—';
  let h=`<div class="card glass"><div class="label">Regra 50/30/20 · em relação à renda</div>
   <div class="kpi3"><div><small>Necessidades<br>ideal ≤50%</small><b style="color:${s.rec&&need/s.rec>.5?'var(--red)':'var(--text)'}">${P(need)}</b></div>
   <div><small>Desejos<br>ideal ≤30%</small><b style="color:${s.rec&&want/s.rec>.3?'var(--red)':'var(--text)'}">${P(want)}</b></div>
   <div><small>Guardado<br>ideal ≥20%</small><b style="color:${s.rec&&sav/s.rec>=.2?'var(--green)':'var(--yellow)'}">${P(Math.max(sav,0))}</b></div></div></div>`;
  h+=`<div class="sec-title"><h3>Recomendações</h3></div><div class="glass">${recHTML(R)||'<div class="empty">Tudo certo por aqui ✨</div>'}</div>`;
  // evolução 6 meses
  const ms=[5,4,3,2,1,0].map(k=>{const F=ymAdd(M,-k),x=summary(F);return{F,r:x.rec,d:x.desp}});const mx=Math.max(1,...ms.map(x=>Math.max(x.r,x.d)));
  let bars='';ms.forEach((x,i)=>{const X=14+i*52,hr=x.r/mx*110,hd=x.d/mx*110;
    bars+=`<rect x="${X}" y="${130-hr}" width="18" height="${hr}" rx="5" fill="#3ee08f"/><rect x="${X+21}" y="${130-hd}" width="18" height="${hd}" rx="5" fill="#ff6b7a"/><text x="${X+19}" y="148" text-anchor="middle" font-size="11" fill="${x.F===M?'#fff':'rgba(235,240,255,.6)'}" font-weight="${x.F===M?700:500}">${ymLabel(x.F)}</text>`});
  h+=`<div class="sec-title"><h3>Últimos 6 meses</h3><span class="label"><span class="in">■</span> receitas <span class="out">■</span> despesas</span></div><div class="card glass" style="padding:14px 10px"><svg viewBox="0 0 330 154" width="100%">${bars}</svg></div>`;
  // orçamento por categoria
  const withLim=outCats.filter(c=>c.lim>0||s.by[c.id]);let used=0,tot=0;
  const rows=withLim.sort((a,b)=>(s.by[b.id]||0)-(s.by[a.id]||0)).map(c=>{const g=s.by[c.id]||0;if(c.lim){used+=Math.min(g,Infinity);tot+=c.lim}
    const p=c.lim?Math.min(g/c.lim*100,100):100,col=c.lim?(g>c.lim?'#ff6b7a':g>c.lim*.8?'#feca57':c.c):c.c;
    return `<div class="budget"><div class="bhead"><b>${c.e} ${esc(c.n)}</b><span style="color:${c.lim&&g>c.lim?'var(--red)':'inherit'}">${brl(g)}</span></div><div class="bar"><i style="width:${p}%;background:${col};${c.lim?'':'opacity:.45'}"></i></div><div class="bfoot"><span>${c.lim?(g>c.lim?'Estourou '+brl(g-c.lim):'Resta '+brl(c.lim-g)):'Sem limite definido'}</span><span>${c.lim?'Limite '+brl(c.lim):''}</span></div></div>`}).join('');
  h+=`<div class="sec-title"><h3>Orçamento por categoria</h3><button class="link" data-act="go" data-v="settings" data-sc="cats">Limites</button></div><div class="glass list">${rows||'<div class="empty">Sem despesas neste mês.</div>'}</div>`;
  return h;
}

let F=null;
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').classList.add('on');$('#scrim').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');F=null}
function newForm(over={}){
  const d=M===ymOf(new Date())?todayStr():dateIn(M,1);

}
function editForm(e){const t=e.t;
  F={mode:'edit',entry:e,type:t.type,cents:Math.round(t.amount*100),desc:t.desc,cat:t.cat,date:t.rec&&!e.card?e.date:t.date,pay:t.pay||'conta',parc:t.parc||1,rec:!!t.rec};renderForm();}
function syncForm(){if(!F)return;const a=$('#fAmount'),d=$('#fDesc'),dt=$('#fDate');if(a)F.cents=+(a.value.replace(/\D/g,'')||0);if(d)F.desc=d.value;if(dt&&dt.value)F.date=dt.value}
function renderForm(){
  const cats=S.cats.filter(c=>c.type===F.type);if(!cats.some(c=>c.id===F.cat))F.cat=cats[0].id;
  if(F.type==='in')F.pay='conta';
  const card=F.pay!=='conta'?cardById(F.pay):null;if(!card)F.parc=1;if(F.parc>1)F.rec=false;
  const v=F.cents/100;
  let fatInfo='';if(card){const F0=faturaOf(card,F.date);fatInfo=F.rec?`Cobrado todo mês a partir da fatura de ${ymLabel(F0)}`:F.parc>1?`${F.parc}x de ${brl(Math.floor(v/F.parc*100)/100)} · de ${ymLabel(F0)} a ${ymLabel(ymAdd(F0,F.parc-1))}`:`Entra na fatura de ${ymLabel(F0)}`}
  openSheet(`<h3>${F.mode==='new'?'Novo lançamento':'Editar lançamento'}${F.mode==='edit'?'<button class="link" style="color:var(--red)" data-act="tx-del">Excluir</button>':''}</h3>
   <div class="seg glass" style="margin-bottom:10px"><button class="${F.type==='out'?'on':''}" data-act="f-type" data-t="out">Despesa</button><button class="${F.type==='in'?'on':''}" data-act="f-type" data-t="in">Receita</button></div>

   <div class="two"><div><div class="flabel">${card?'Data da compra':'Data'}</div><input class="field" type="date" id="fDate" value="${F.date}"></div></div>
   ${F.type==='out'?`<div class="flabel">Forma de pagamento</div><div class="chips"><button class="${F.pay==='conta'?'on':''}" data-act="f-pay" data-id="conta">💵 Débito / Pix / Dinheiro</button>${S.cards.map(c=>`<button class="${F.pay===c.id?'on':''}" data-act="f-pay" data-id="${c.id}" style="${F.pay===c.id?'background:'+c.c:''}">💳 ${esc(c.n)}</button>`).join('')}<button data-act="card-new" data-from="form">＋ Cartão</button></div>`:''}
   ${card?`<div class="optrow"><div class="t">Parcelas<small>${F.rec?'Desative “repetir” para parcelar':fatInfo}</small></div><div class="stepper"><button data-act="f-parc" data-d="-1">−</button><b>${F.parc}x</b><button data-act="f-parc" data-d="1">+</button></div></div>`:''}
   <div class="optrow"><div class="t">Repetir todo mês<small>${F.rec?(card?fatInfo:'Aparece automaticamente nos próximos meses'):'Ideal para salário, aluguel, contas e assinaturas'}</small></div><label class="switch"><input type="checkbox" id="fRec" ${F.rec?'checked':''} ${F.parc>1?'disabled':''}><span></span></label></div>
   <button class="btn primary" data-act="tx-save">${F.mode==='new'?'Salvar lançamento':'Salvar alterações'}</button>`);

  $('#fRec').addEventListener('change',e=>{syncForm();F.rec=e.target.checked;renderForm()});

async function saveTx(){
  syncForm();const amount=F.cents/100;
  if(!(amount>0))return toast('Informe um valor');
  if(!F.date)return toast('Informe a data');
  const data={type:F.type,amount,desc:F.desc.trim()||catById(F.cat).n,cat:F.cat,date:F.date,pay:F.type==='in'?'conta':F.pay,parc:F.pay!=='conta'?F.parc:1,rec:F.rec};
  if(F.mode==='new'){S.tx.push(Object.assign({id:uid()},data));toast('✓ Lançamento salvo')}
  else{const t=F.entry.t,occ=F.entry.occ,start=t.date.slice(0,7);
    if(t.rec&&occ>start){
      const ch=await modal({title:'Alterar lançamento recorrente',text:'Como aplicar a alteração?',buttons:[{l:`A partir de ${ymLabel(occ)}`,v:'from',s:'primary'},{l:'Em todos os meses',v:'all'},{l:'Cancelar',v:null}]});
      if(!ch)return;
      if(ch==='from'){t.end=ymAdd(occ,-1);const nd=data.date.slice(0,7)<occ?dateIn(occ,+data.date.slice(8)):data.date;S.tx.push(Object.assign({id:uid()},data,{date:nd}))}
      else Object.assign(t,data,{date:dateIn(start,+data.date.slice(8))});
    } else Object.assign(t,data);
    toast('✓ Alterações salvas');}
  save();closeSheet();render();
}
async function deleteTx(){
  const e=F.entry,t=e.t,start=t.date.slice(0,7);let ch;
  if(t.rec){ch=await modal({title:'Excluir lançamento recorrente',text:`“${t.desc}” se repete todo mês.`,buttons:[{l:`Só ${ymLabel(e.occ)}`,v:'one'},{l:`De ${ymLabel(e.occ)} em diante`,v:'from',s:'danger'},{l:'Todos os meses',v:'all',s:'danger'},{l:'Cancelar',v:null}]});
    if(!ch)return;
    if(ch==='one')(t.skip=t.skip||[]).push(e.occ);
    else if(ch==='from'&&e.occ>start)t.end=ymAdd(e.occ,-1);
    else S.tx=S.tx.filter(x=>x!==t);
  } else {const n=t.parc||1;
    if(!await modal({title:'Excluir lançamento?',text:n>1?`A compra “${t.desc}” e todas as ${n} parcelas serão removidas.`:`“${t.desc}” será removido.`,buttons:[{l:'Excluir',v:true,s:'danger'},{l:'Cancelar',v:false}]}))return;
    S.tx=S.tx.filter(x=>x!==t);}
  save();closeSheet();render();toast('Lançamento excluído');
}

function modal({title,text,buttons,html}){return new Promise(res=>{
  $('#modal').innerHTML=`<h4>${esc(title)}</h4>${text?`<p>${esc(text)}</p>`:''}${html||''}${buttons.map((b,i)=>`<button class="btn small ${b.s||''}" data-mi="${i}">${esc(b.l)}</button>`).join('')}`;
  $('#modalWrap').classList.add('on');

/* ================= arquivos: compartilhar / baixar ================= */
async function deliver(blob,name,title){
  const file=new File([blob],name,{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})&&/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[file],title});return true}}
  catch(e){if(e.name==='AbortError')return false}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
  catch(e){toast('Não foi possível salvar o arquivo');return false}
}

  const payload={app:'financas-pessoais',versao:1,exportadoEm:new Date().toISOString(),dados:S};

  const ok=await deliver(blob,`financas-backup-${todayStr()}.json`,'Backup Finanças');

    await snapshotNow();S=Object.assign(freshState(),d);S.dirty=false;save(false);render();toast('✓ Backup restaurado');

async function snapshotNow(){try{let snaps=JSON.parse(await DB.get('snaps')||'[]');snaps.unshift({d:todayStr(),n:S.tx.length,s:JSON.stringify(S)});await DB.set('snaps',JSON.stringify(snaps.slice(0,10)))}catch(e){}}
function exportCSV(){
  const rows=[['Mês','Data','Descrição','Categoria','Tipo','Forma de pagamento','Parcela','Valor']];
  const all=S.tx.map(t=>t.date.slice(0,7)).sort();if(!all.length)return toast('Nada para exportar');
  let first=all[0],last=ymAdd(ymOf(new Date()),12);
  for(let m=first;m<=last;m=ymAdd(m,1))for(const e of entriesFor(m).reverse()){const c=e.card?cardById(e.card):null;
    rows.push([m,e.date.split('-').reverse().join('/'),e.desc,catById(e.cat).n,e.v>0?'Receita':'Despesa',c?'Cartão '+c.n:'Conta',e.tag||'',e.v.toFixed(2).replace('.',',')])}
  const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  deliver(new Blob([csv],{type:'text/csv'}),`financas-${todayStr()}.csv`,'Planilha Finanças');
}

function pdfStr(s){s=String(s).replace(/[–—−]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,'...').replace(/ | /g,' ');
  let o='';for(const ch of s){const c=ch.codePointAt(0);if((c>=32&&c<=126)||(c>=160&&c<=255))o+=String.fromCharCode(c);else if(c===8226)o+='\x95'}return o.trim()?o:o}
function pdfW(s,size,bold){const T=bold?W2:W1;let w=0;for(const ch of s){let c=ch.charCodeAt(0);if(c>=160){const b=ch.normalize('NFD').charCodeAt(0);c=b<=126&&b>=32?b:110}if(c<32||c>126)c=110;w+=T[c-32]}return w*size/1000}
const hex=c=>{c=c.replace('#','');return [0,2,4].map(i=>(parseInt(c.substr(i,2),16)/255).toFixed(3)).join(' ')};
class PDF{
  constructor(){this.pages=[];this.add()}
  add(){this.ops=[];this.pages.push(this.ops);this.y=0}
  text(x,y,s,o={}){const size=o.size||10,bold=!!o.bold;let t=pdfStr(s);
    if(o.max)t=this.fit(t,o.max,size,bold);let X=x;const w=pdfW(t,size,bold);if(o.align==='right')X=x-w;else if(o.align==='center')X=x-w/2;
    this.ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${hex(o.color||'#1b1f2a')} rg ${X.toFixed(2)} ${(842-y).toFixed(2)} Td (${t.replace(/[\\()]/g,m=>'\\'+m)}) Tj ET`)}
  fit(t,max,size,bold){if(pdfW(t,size,bold)<=max)return t;while(t.length&&pdfW(t+'...',size,bold)>max)t=t.slice(0,-1);return t+'...'}
  rect(x,y,w,h,color){this.ops.push(`${hex(color)} rg ${x.toFixed(2)} ${(842-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`)}
  line(x1,y1,x2,y2,color='#e5e7ee',w=.6){this.ops.push(`${hex(color)} RG ${w} w ${x1} ${(842-y1).toFixed(2)} m ${x2} ${(842-y2).toFixed(2)} l S`)}
  blob(){
    const objs=[null,'<< /Type /Catalog /Pages 2 0 R >>',null,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
    const kids=[];for(const ops of this.pages){const content=ops.join('\n');const pi=objs.length,ci=pi+1;kids.push(`${pi} 0 R`);
      objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`);
      objs.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`)}
    objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
    let out='%PDF-1.4\n%\xe2\xe3\xcf\xd3\n';const off=[];
    for(let i=1;i<objs.length;i++){off[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
    const xref=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;for(let i=1;i<objs.length;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
    out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return new Blob([b],{type:'application/pdf'})}
}
const money=v=>brl(v).replace(/\s/g,' ');
function pdfHeader(p,title,sub){p.rect(0,0,595,96,'#1c2452');p.rect(0,92,595,4,'#5aa8ff');

function pdfFooter(p){const n=p.pages.length;p.pages.forEach((ops,i)=>{p.ops=ops;p.line(40,808,555,808);p.text(40,824,S.nome?'Extrato de '+S.nome:'Controle financeiro pessoal',{size:8,color:'#9aa0ad'});p.text(555,824,`Página ${i+1} de ${n}`,{size:8,color:'#9aa0ad',align:'right'})})}
function pdfTable(p,y,cols,rows,opts={}){

  head();rows.forEach((r,i)=>{if(y>780){p.add();y=50;head()}
    if(i%2)p.rect(40,y,515,20,'#fafbfe');
    cols.forEach((c,j)=>{const cell=r.cells[j];p.text(c.align==='right'?c.x+c.w:c.x,y+13.5,cell,{size:9,max:c.w-4,align:c.align,bold:c.bold,color:j===cols.length-1?(r.color||'#1b1f2a'):c.color||'#1b1f2a'})});

  return y;
}

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'go':view=d.v;closeSheet();render();window.scrollTo({top:0});if(d.sc)setTimeout(()=>document.getElementById(d.sc)?.scrollIntoView({behavior:'smooth'}),60);break;
    case 'prev':M=ymAdd(M,-1);render();break;
    case 'next':M=ymAdd(M,1);render();break;
    case 'add':newForm();break;
    case 'preset':newForm(d.p==='salario'?{type:'in',cat:'salario',desc:'Salário',rec:true,date:dateIn(M,5)}:{type:'out',cat:'moradia',desc:'Aluguel',rec:true,date:dateIn(M,10)});break;

  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){query=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='nome'){S.nome=e.target.value.trim().slice(0,30);save(false);$('#hello').textContent=S.nome?`Olá, ${S.nome} 👋`:'Olá 👋'}
  if(e.target.dataset.lim){const el=e.target,c=+(el.value.replace(/\D/g,'')||0);el.value=c?brl(c/100):'';const cat=S.cats.find(x=>x.id===el.dataset.lim);if(cat){cat.lim=c/100;save()}}
});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=''});
window.addEventListener('online',render);window.addEventListener('offline',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sheet').classList.contains('on'))render()});

/* ================= início ================= */
(async()=>{
  await load();render();
  if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  if(navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist()}catch(e){}}
})();
</script>
</body>
